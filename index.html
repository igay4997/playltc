<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>playltc</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='12' width='12' height='44' rx='6' fill='%23ff3b3b'/%3E%3Ccircle cx='26' cy='28' r='13' fill='none' stroke='%23ff3b3b' stroke-width='10'/%3E%3Crect x='49' y='6' width='12' height='50' rx='6' fill='%23ff3b3b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #161320;
  --ink: #ff3b3b;
  --ink-deep: #c42222;
  --ripple: rgba(255, 208, 77, 0.35);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
:root:not([data-theme="light"]) { --bg: #161320; --ink: #ff3b3b; }
:root[data-theme="dark"] { --bg: #161320; --ink: #ff3b3b; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  overflow: hidden;
  display: grid;
  place-items: center;
  -webkit-tap-highlight-color: transparent;
}
h1 {
  margin: 0;
  font-family: "Lilita One", "Chewy", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  font-weight: 400;
  font-size: clamp(3.5rem, 15vw, 9rem);
  line-height: 1;
  letter-spacing: 0.01em;
  color: var(--ink);
  transform: rotate(-2deg);
  display: flex;
  text-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
  user-select: none;
  position: relative;
  z-index: 2;
}
h1 span {
  display: inline-block;
  animation: bob 3.2s ease-in-out infinite;
  animation-delay: calc(var(--i) * -0.38s);
  will-change: transform;
}
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(0deg) scaleY(1); }
  25% { transform: translateY(-0.12em) rotate(-3deg); }
  50% { transform: translateY(0.03em) rotate(0deg); }
  75% { transform: translateY(0.12em) rotate(3deg); }
}
.ring {
  position: fixed;
  width: 20px;
  height: 20px;
  margin: -10px 0 0 -10px;
  border-radius: 50%;
  border: 3px solid var(--ripple);
  pointer-events: none;
  animation: ripple 2.4s cubic-bezier(0.2, 0.6, 0.3, 1) forwards;
  z-index: 1;
}
@keyframes ripple {
  from { transform: scale(1); opacity: 1; }
  to { transform: scale(38); opacity: 0; border-width: 0.5px; }
}
.ring.slow { animation-duration: 3.4s; }
.dot {
  position: fixed;
  width: 20px;
  height: 20px;
  margin: -10px 0 0 -10px;
  border-radius: 50%;
  background: rgba(255, 208, 77, 0.16);
  pointer-events: none;
  z-index: 0;
  animation: splash 2.2s cubic-bezier(0.1, 0.7, 0.3, 1) forwards;
}
@keyframes splash {
  0% { transform: scale(0); opacity: 0; }
  12% { opacity: 1; }
  100% { transform: scale(var(--max, 8)); opacity: 0; }
}
.ring.big { animation-name: ripple-big; }
@keyframes ripple-big {
  from { transform: scale(1); opacity: 1; }
  to { transform: scale(var(--max, 20)); opacity: 0; border-width: 0.5px; }
}
.tg {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 9vh);
  display: flex;
  justify-content: center;
  pointer-events: none;
  z-index: 2;
}
.tg span {
  display: inline-flex;
  align-items: center;
  gap: 0.6em;
  padding: 0.55em 1.2em;
  border: 2px solid var(--ink);
  border-radius: 999px;
  font-family: "Lilita One", "Chewy", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  font-size: clamp(1rem, 3.6vw, 1.35rem);
  letter-spacing: 0.02em;
  color: var(--ink);
}
.tg svg { width: 1.2em; height: 1.2em; fill: currentColor; flex: none; }
.chat[hidden], .chat-toggle[hidden] { display: none; }
.chat {
  position: fixed;
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  top: 50%;
  transform: translateY(-50%);
  width: min(300px, calc(100vw - 32px));
  height: min(460px, 64vh);
  display: flex;
  flex-direction: column;
  background: rgba(22, 19, 32, 0.94);
  border: 2px solid var(--ink);
  border-radius: 18px;
  z-index: 3;
  overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: #efe9f7;
  cursor: auto;
}
.chat-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 2px solid var(--ink);
  font-family: "Lilita One", "Chewy", "Arial Rounded MT Bold", sans-serif;
  font-size: 1.15rem;
  color: var(--ink);
}
.chat-head small { font-family: system-ui, sans-serif; font-size: 0.75rem; opacity: 0.85; margin-left: 0.6em; }
.chat-head button { background: none; border: 0; color: var(--ink); font-size: 1.3rem; line-height: 1; cursor: pointer; padding: 0 2px; }
.chat-msgs {
  flex: 1;
  overflow-y: auto;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.92rem;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.chat-msgs .note { opacity: 0.7; }
.msg b { color: var(--ink); font-weight: 600; }
.chat-form { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-top: 2px solid var(--ink); }
.chat-row { display: flex; gap: 6px; }
.chat input {
  font: inherit;
  font-size: 16px;
  color: #efe9f7;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--ink);
  border-radius: 10px;
  padding: 8px 10px;
  min-width: 0;
}
.chat input#chatText { flex: 1; }
.chat input#chatName { padding: 5px 10px; font-size: 14px; }
.chat .send {
  font-family: "Lilita One", "Chewy", "Arial Rounded MT Bold", sans-serif;
  font-size: 1rem;
  background: var(--ink);
  color: var(--bg);
  border: 0;
  border-radius: 10px;
  padding: 0 14px;
  cursor: pointer;
}
.chat .send:disabled, .chat input:disabled { opacity: 0.5; cursor: not-allowed; }
.chat-toggle {
  position: fixed;
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index: 3;
  font-family: "Lilita One", "Chewy", "Arial Rounded MT Bold", sans-serif;
  font-size: 1.1rem;
  color: var(--ink);
  background: var(--bg);
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 0.45em 1.1em;
  cursor: pointer;
}
:focus-visible { outline: 3px solid var(--ink); outline-offset: 8px; }
@media (prefers-reduced-motion: reduce) {
  h1 span { animation: none; }
  .ring, .dot { display: none; }
}
</style>
</head>
<body>
<h1 id="logo" aria-label="playltc"></h1>

<div class="tg">
  <span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 4.1 2.9 11.4c-1.3.5-1.3 1.3-.2 1.6l4.9 1.5 1.9 5.7c.2.6.4.8.8.8.4 0 .6-.2.9-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.8-.8L23 5.4c.3-1.3-.5-1.9-1.1-1.3Z"/></svg>
    t.me/coming soon
  </span>
</div>

<button class="chat-toggle" id="chatToggle" type="button" hidden>chat</button>
<aside class="chat" id="chat" aria-label="Global chat">
  <div class="chat-head"><div>chat<small id="chatStatus">connecting…</small></div><button id="chatClose" type="button" aria-label="Close chat">&times;</button></div>
  <div class="chat-msgs" id="chatMsgs" aria-live="polite"></div>
  <form class="chat-form" id="chatForm" autocomplete="off">
    <input id="chatName" maxlength="16" aria-label="Your name" placeholder="your name">
    <div class="chat-row">
      <input id="chatText" maxlength="200" aria-label="Message" placeholder="say something">
      <button class="send" type="submit">send</button>
    </div>
  </form>
</aside>

<script>
(function () {
  var word = "playltc";
  var logo = document.getElementById("logo");
  word.split("").forEach(function (ch, i) {
    var s = document.createElement("span");
    s.textContent = ch;
    s.style.setProperty("--i", i);
    s.setAttribute("aria-hidden", "true");
    logo.appendChild(s);
  });

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function ring(x, y, slow) {
    if (reduce) return;
    var r = document.createElement("div");
    r.className = "ring" + (slow ? " slow" : "");
    r.style.left = x + "px";
    r.style.top = y + "px";
    document.body.appendChild(r);
    setTimeout(function () { r.remove(); }, 3600);
  }


  // random circle splashes anywhere on the screen
  function splash(x, y) {
    if (reduce) return;
    var max = 6 + Math.random() * 10;
    var d = document.createElement("div");
    d.className = "dot";
    d.style.left = x + "px";
    d.style.top = y + "px";
    d.style.setProperty("--max", max);
    document.body.appendChild(d);

    var n = 1 + Math.floor(Math.random() * 2);
    for (var k = 0; k < n; k++) {
      (function (k) {
        setTimeout(function () {
          var r = document.createElement("div");
          r.className = "ring big";
          r.style.left = x + "px";
          r.style.top = y + "px";
          r.style.setProperty("--max", max * (2.2 + k * 0.8));
          document.body.appendChild(r);
          setTimeout(function () { r.remove(); }, 2600);
        }, 140 + k * 220);
      })(k);
    }
    setTimeout(function () { d.remove(); }, 2400);
  }

  function randomSplash() {
    var pad = 40;
    splash(
      pad + Math.random() * (window.innerWidth - pad * 2),
      pad + Math.random() * (window.innerHeight - pad * 2)
    );
    setTimeout(randomSplash, 500 + Math.random() * 1300);
  }

})();
</script>
<script>
(function () {
  // Paste your Firebase Realtime Database URL between the quotes, e.g.
  // https://your-project-default-rtdb.firebaseio.com
  var DB = "";

  var root = document.getElementById("chat");
  var toggle = document.getElementById("chatToggle");
  var list = document.getElementById("chatMsgs");
  var statusEl = document.getElementById("chatStatus");
  var form = document.getElementById("chatForm");
  var input = document.getElementById("chatText");
  var nameEl = document.getElementById("chatName");

  function setOpen(open) { root.hidden = !open; toggle.hidden = open; }
  setOpen(window.innerWidth >= 800);
  toggle.addEventListener("click", function () { setOpen(true); });
  document.getElementById("chatClose").addEventListener("click", function () { setOpen(false); });

  var name = "";
  try { name = localStorage.getItem("playltc-name") || ""; } catch (e) {}
  if (!name) name = "guest" + Math.floor(1000 + Math.random() * 9000);
  nameEl.value = name;
  function saveName() {
    name = nameEl.value.trim().slice(0, 16) || name;
    nameEl.value = name;
    try { localStorage.setItem("playltc-name", name); } catch (e) {}
  }
  nameEl.addEventListener("change", saveName);

  function note(text) {
    list.textContent = "";
    var p = document.createElement("div");
    p.className = "note";
    p.textContent = text;
    list.appendChild(p);
  }

  if (!DB) {
    statusEl.textContent = "offline";
    note("Chat turns on once the database is connected.");
    input.disabled = true; nameEl.disabled = true;
    form.querySelector(".send").disabled = true;
    return;
  }

  var base = DB.replace(/\/$/, "");
  var msgs = {};
  function valid(m) { return m && typeof m.name === "string" && typeof m.text === "string"; }

  function render() {
    var keys = Object.keys(msgs).sort();
    while (keys.length > 60) delete msgs[keys.shift()];
    var stick = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
    list.textContent = "";
    if (!keys.length) { note("No messages yet. Say hi!"); return; }
    keys.forEach(function (k) {
      var m = msgs[k];
      var row = document.createElement("div");
      row.className = "msg";
      var b = document.createElement("b");
      b.textContent = m.name.slice(0, 16);
      var t = document.createElement("span");
      t.textContent = " " + m.text.slice(0, 200);
      row.appendChild(b);
      row.appendChild(t);
      list.appendChild(row);
    });
    if (stick) list.scrollTop = list.scrollHeight;
  }

  var es = new EventSource(base + "/messages.json?orderBy=" + encodeURIComponent('"$key"') + "&limitToLast=60");
  es.addEventListener("open", function () { statusEl.textContent = "live"; });
  es.addEventListener("error", function () { statusEl.textContent = "reconnecting…"; });
  function onEvent(e) {
    var p;
    try { p = JSON.parse(e.data); } catch (x) { return; }
    if (!p || typeof p.path !== "string") return;
    if (p.path === "/") {
      msgs = {};
      if (p.data && typeof p.data === "object") {
        Object.keys(p.data).forEach(function (k) { if (valid(p.data[k])) msgs[k] = p.data[k]; });
      }
    } else {
      var k = p.path.slice(1);
      if (k.indexOf("/") > -1) return;
      if (p.data === null) delete msgs[k];
      else if (valid(p.data)) msgs[k] = p.data;
    }
    render();
    list.scrollTop = list.scrollHeight;
  }
  es.addEventListener("put", onEvent);
  es.addEventListener("patch", onEvent);

  var last = 0;
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    saveName();
    var text = input.value.trim().slice(0, 200);
    var now = Date.now();
    if (!text || now - last < 1500) return;
    last = now;
    input.value = "";
    fetch(base + "/messages.json", {
      method: "POST",
      body: JSON.stringify({ name: name, text: text, ts: { ".sv": "timestamp" } })
    }).catch(function () { statusEl.textContent = "send failed"; });
  });
})();
</script>
</body>
</html>
